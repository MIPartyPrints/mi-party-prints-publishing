name: Pinterest Publisher
on:
  workflow_dispatch:
    inputs:
      job_path:
        description: Approved job JSON path
        required: true
        default: jobs/DFC-PIN-001-v3.json
        type: string
      execute:
        description: Execute real Pinterest publish
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate locked commissioning manifest
        if: ${{ !inputs.execute }}
        run: python publisher/validate_job.py "${{ inputs.job_path }}" --allow-external-asset
      - name: Real-publish safety gate
        if: ${{ inputs.execute }}
        run: |
          echo "Real execution remains disabled until Pinterest app access, OAuth, exact board ID, and exact asset-byte handoff are commissioned."
          exit 1
      - name: Dry-run result
        if: ${{ !inputs.execute }}
        run: echo "Locked approved manifest validated. No Pinterest call made."
